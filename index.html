<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kat ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffd6e8, #ffeef6);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
    }

    .card {
        background: white;
        padding: 30px 20px;
        border-radius: 25px;
        text-align: center;
        width: 90%;
        max-width: 350px;
        position: relative;
        box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }

    h1 {
        font-size: 20px;
        margin-bottom: 30px;
    }

    .buttons {
        position: relative;
        height: 120px;
    }

    button {
        padding: 14px 28px;
        font-size: 16px;
        border-radius: 40px;
        border: none;
        cursor: pointer;
        position: absolute;
        transition: all 0.25s ease;
    }

    #yesBtn {
        background: #ff4f8b;
        color: white;
        left: 50%;
        transform: translateX(-50%);
        animation: pulse 1.5s infinite;
    }

    #noBtn {
        background: #eee;
        color: #333;
        left: 20px;
        top: 70px;
    }

    #message {
        margin-top: 20px;
        font-weight: bold;
        font-size: 20px;
        color: #ff4f8b;
        display: none;
        animation: popIn 0.6s ease forwards;
    }

    @keyframes pulse {
        0% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.1); }
        100% { transform: translateX(-50%) scale(1); }
    }

    @keyframes popIn {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .heart {
        position: fixed;
        bottom: -10px;
        font-size: 24px;
        animation: floatUp 4s linear forwards;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
    }
</style>
</head>

<body>

<div class="card">
    <h1>Kat, will you be my Valentine?</h1>

    <div class="buttons">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <div id="message">yayyy I love you ❤️</div>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");

    function moveNoButton() {
        const card = document.querySelector(".card");
        const maxX = card.clientWidth - noBtn.offsetWidth;
        const maxY = card.clientHeight - noBtn.offsetHeight;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";
    }

    noBtn.addEventListener("mouseover", moveNoButton);

    noBtn.addEventListener("touchstart", function(e) {
        e.preventDefault();
        moveNoButton();
    });

    yesBtn.addEventListener("click", () => {
        message.style.display = "block";
        yesBtn.innerText = "❤️";

        for (let i = 0; i < 25; i++) {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerText = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 4000);
        }
    });
</script>

</body>
</html>
