<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forever ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff4f8b, #ff1f6b);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    text-align: center;
    color: white;
    overflow: hidden;
}

.container {
    padding: 30px;
}

h1 {
    font-size: 30px;
    margin-bottom: 20px;
    animation: dramatic 1s ease;
}

button {
    padding: 15px 35px;
    font-size: 18px;
    border-radius: 40px;
    border: none;
    background: white;
    color: #ff1f6b;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

@keyframes dramatic {
    0% { opacity: 0; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>
<div class="container">
    <h1>Kat... Forever? ❤️</h1>
    <button onclick="forever()">Forever ♾️</button>
</div>

<script>
function forever() {
    document.body.innerHTML = "<h1 style='font-size:40px;'>Forever & Always ❤️♾️</h1>";
}
</script>

</body>
</html>
